name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment (ignored on redeploy)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      redeploy:
        description: Redeploy the existing tag selected in 'Use workflow from' (skips tag and release creation)
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Create tag and release notes
    # New releases run from main or chain/*; redeploys run from a release tag
    if: >-
      (!inputs.redeploy && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/chain/'))) ||
      (inputs.redeploy && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      slack_ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Issue release App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check release permission
        # Only service-managers team members can release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ github.repository_owner }}
          TEAM: ${{ vars.RELEASE_TEAM || 'service-managers' }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          state=$(gh api "orgs/${ORG}/teams/${TEAM}/memberships/${ACTOR}" --jq .state 2>/dev/null || true)
          if [ "$state" != "active" ]; then
            echo "::error::${ACTOR} is not an active member of ${ORG}/${TEAM}"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Resolve tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
          REDEPLOY: ${{ inputs.redeploy }}
        run: |
          if [ "$REDEPLOY" = "true" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::${tag} is not a release tag (vX.Y.Z)"; exit 1
            fi
            {
              echo "tag=${tag}"
              echo "version=${tag#v}"
              echo "prev="
              echo "redeploy=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags=$(git tag --list "v*" --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" || true)
          # A re-run reuses the tag its earlier attempt pushed for this commit instead of bumping again
          tag=""
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            tag=$(git tag --points-at "$GITHUB_SHA" --list "v*" --sort=-v:refname \
              | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)
          fi
          if [ -n "$tag" ]; then
            reused=true
            VERSION="${tag#v}"
            prev=$(echo "$tags" | grep -A1 -Fx "$tag" | sed -n 2p || true)
          else
            reused=false
            # Previous release tag
            prev=$(echo "$tags" | head -n1)
            if [ -z "$prev" ]; then
              major=0; minor=1; patch=0
            else
              IFS=. read -r major minor patch <<< "${prev#v}"
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
                *) echo "::error::bump must be patch, minor or major"; exit 1 ;;
              esac
            fi
            VERSION="${major}.${minor}.${patch}"
            tag="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists"; exit 1
            fi
          fi
          {
            echo "tag=${tag}"
            echo "version=${VERSION}"
            echo "prev=${prev}"
            echo "redeploy=false"
            echo "reused=${reused}"
          } >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.tag.outputs.redeploy != 'true' && steps.tag.outputs.reused != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.tag.outputs.redeploy != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.tag.outputs.prev }}
        run: |
          # A re-run may find the release created by an earlier attempt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping"; exit 0
          fi
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [ -n "$PREV" ]; then args+=(--notes-start-tag "$PREV"); fi
          gh release create "$TAG" "${args[@]}"

      - name: Post to Slack
        id: slack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.tag.outputs.prev }}
          SLACK_TOKEN: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          REDEPLOY: ${{ steps.tag.outputs.redeploy }}
        run: |
          if [ -z "$SLACK_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "Slack is not configured, skipping"; exit 0
          fi
          if [ "$REDEPLOY" = "true" ]; then
            payload=$(jq -n --arg ch "$SLACK_CHANNEL" \
              --arg t "*${GITHUB_REPOSITORY}* \`${TAG}\` redeploy by ${GITHUB_ACTOR}" \
              '{channel: $ch, text: $t}')
          else
            url=$(gh release view "$TAG" --json url -q .url)
            # GitHub markdown -> Slack mrkdwn
            body=$(gh release view "$TAG" --json body -q .body \
              | sed -E 's/^#+ (.*)$/*\1*/; s/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' | head -c 2800)
            header="*${GITHUB_REPOSITORY}* \`${TAG}\` (since: \`${PREV:-initial}\`) by ${GITHUB_ACTOR}"
            payload=$(jq -n --arg ch "$SLACK_CHANNEL" --arg h "$header" --arg b "${body:-No changes}" --arg u "$url" '{
                channel: $ch, text: $h,
                blocks: [
                  {type: "section", text: {type: "mrkdwn", text: $h}},
                  {type: "section", text: {type: "mrkdwn", text: $b}},
                  {type: "context", elements: [{type: "mrkdwn", text: ("<" + $u + "|Full release notes>")}]}
                ]}')
          fi
          res=$(echo "$payload" \
            | curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                -H 'Content-Type: application/json; charset=utf-8' -d @-)
          if [ "$(echo "$res" | jq -r .ok)" != "true" ]; then
            echo "::warning::Slack post failed: $(echo "$res" | jq -r .error)"; exit 0
          fi
          echo "ts=$(echo "$res" | jq -r .ts)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Vercel Production
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install --global --ignore-scripts vercel@63.1.2

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify deploy result
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.slack_ts != ''
    runs-on: ubuntu-latest
    steps:
      - name: Post result to Slack thread
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          THREAD_TS: ${{ needs.prepare.outputs.slack_ts }}
          RESULT: ${{ needs.deploy.result }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then status="deployed"; else status="deploy failed (${RESULT})"; fi
          text="\`${TAG}\` ${status} <${RUN_URL}|run log>"
          if [ -n "$DEPLOY_URL" ]; then text="${text} | <${DEPLOY_URL}|deployment>"; fi
          jq -n --arg ch "$SLACK_CHANNEL" --arg ts "$THREAD_TS" --arg t "$text" \
            '{channel: $ch, thread_ts: $ts, text: $t}' \
          | curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H 'Content-Type: application/json; charset=utf-8' -d @- >/dev/null
